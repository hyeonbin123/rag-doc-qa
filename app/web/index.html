<!doctype html>
<html lang="ko">
<!-- [파일 역할] 브라우저에서 API를 바로 써 보는 채팅 화면(GET /가 이 파일을 그대로 돌려준다, -->
<!-- app/main.py). 로그인·계정 만들기, 질문, 답변과 근거 문서, 단계별 걸린 시간을 한 화면에서 보여 준다. -->
<!-- [설계 이유] 빌드가 필요한 별도 프론트엔드 앱 대신 정적 HTML 한 장으로 둔다(README '하지 않은 것'). -->
<!-- 화면은 다른 클라이언트와 똑같은 공개 API(/auth/*, /query/ask, /logs, /health)만 부른다. -->
<!-- [보안] 서버가 보내는 CSP가 같은 출처의 파일만 실행하도록 막으므로, 이 파일에는 인라인 script·style이 -->
<!-- 없다. 스타일은 /static/chat.css, 동작은 /static/chat.js에 있다. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastAPI 문서에 물어보기</title>
<!-- 화면 스타일(app/web/static/chat.css). CSP 때문에 style 태그 대신 같은 출처의 파일로 불러온다. -->
<link rel="stylesheet" href="/static/chat.css">
</head>
<body>
<!-- 상단 막대: 제목, 서버 상태 줄(#status, chat.js가 /health 결과로 검색 방식·답변 모델을 채움), 로그인한 -->
<!-- 이메일과 로그아웃 버튼(로그인 전에는 hidden). -->
<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <h1>FastAPI 문서에 물어보기</h1>
      <p id="status">서버 상태를 확인하는 중</p>
    </div>
    <div class="who" id="who" hidden>
      <span id="who-email"></span>
      <button type="button" class="text-button" id="logout">로그아웃</button>
    </div>
  </div>
</header>

<!-- 대화 영역. chat.js가 질문 말풍선, 답변, 근거 문서, 걸린 시간을 #log에 붙인다. 이 영역만 스크롤된다. -->
<!-- aria-live="polite"라 새 답변이 붙으면 화면 읽기 프로그램이 읽어 준다. -->
<main id="scroller">
  <div class="log" id="log" aria-live="polite"></div>
</main>

<!-- 하단 입력부: 로그인 전에는 로그인 폼, 로그인 뒤에는 질문 폼이 보인다(chat.js가 hidden 속성을 바꿈). -->
<footer class="dock">
  <div class="dock-inner">
    <!-- 질문 폼. 보이지 않는 label로 입력칸 이름을 화면 읽기 프로그램에 알린다. Enter 전송, Shift+Enter -->
    <!-- 줄바꿈, 한글 조합 중 Enter 무시는 chat.js가 처리한다. -->
    <form class="ask" id="ask-form" hidden>
      <label class="sr-only" for="question">질문</label>
      <textarea id="question" rows="1" placeholder="예: 존재하지 않는 항목을 요청하면 404 오류를 어떻게 반환하나요?"></textarea>
      <button class="primary" id="ask-button" type="submit">질문하기</button>
    </form>
    <p class="hint" id="ask-hint" hidden>한국어로 물으면 한국어 번역 문서에서, 영어로 물으면 영어 원문에서 찾아 답해요. Enter로 보내고 Shift+Enter로 줄을 바꿔요.</p>

    <!-- 로그인과 계정 만들기가 같은 입력칸을 쓴다. 로그인은 폼 제출, 계정 만들기는 별도 버튼(가입 뒤 바로 -->
    <!-- 로그인)이다. 그래서 비밀번호 칸에 minlength를 걸지 않았다. 걸면 가입 규칙(8자 이상)이 생기기 전에 -->
    <!-- 만든 짧은 비밀번호 계정의 로그인까지 막힌다. 비밀번호 규칙은 서버가 422로 알려 주고 chat.js가 -->
    <!-- 안내 문구로 바꾼다. -->
    <form class="login" id="login-form">
      <input id="email" type="email" placeholder="이메일" autocomplete="username" aria-label="이메일" required>
      <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
      <button class="primary" type="submit">로그인</button>
      <button class="secondary" type="button" id="register">계정 만들기</button>
    </form>
    <!-- 로그인·가입 진행 상황과 오류 문구. role="status"라 내용이 바뀌면 화면 읽기 프로그램이 알려 준다. -->
    <p class="form-msg" id="login-msg" role="status">질문하려면 로그인하세요. 계정이 없으면 이메일과 비밀번호를 넣고 계정 만들기를 누르세요.</p>
  </div>
</footer>

<!-- 본문 끝에서 스크립트를 불러, 실행될 때 위 요소들이 이미 만들어져 있게 한다. -->
<script src="/static/chat.js"></script>
</body>
</html>
