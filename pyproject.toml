[project]
name = "rag-doc-qa"
version = "0.1.0"
description = "RAG-based document QA API over the FastAPI docs (FastAPI + pgvector + Claude)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.52,<2.2",  # 2.1부터 비동기 엔진에 필요한 greenlet은 이 extra로만 설치된다
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "email-validator>=2.0",
    "pydantic-settings>=2.3",
    "pyjwt>=2.12",  # HS256 JWT 서명·검증. python-jose 3.5.0에 고친 판이 없는 보안 권고가 있어 2026-10에 바꿈
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.34",
    "sentence-transformers>=3.0",
    "torch>=2.4",  # 아래 tool.uv.sources가 CPU 빌드로 고정한다(앱 코드도 dtype 등에 직접 import)
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

# torch는 CPU 전용 빌드를 쓴다. 임베딩·재정렬을 CPU에서 돌리고, PyPI의 Linux 휠은 CUDA 라이브러리 약 3GB를
# 함께 끌어오기 때문이다. explicit = true라 이 색인은 tool.uv.sources로 지정한 torch에만 쓰이고, 다른
# 패키지는 PyPI에서 받는다.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 저장소 루트에서 인자 없이 `pytest`를 돌리면 tests/만 모은다(CI와 README '테스트'의 `uv run pytest`). 지정하지 않으면
# 저장소 루트 아래를 모두 훑어서, gitignore돼 저장소에는 없는 로컬 작업 디렉터리의 테스트 파일까지 모은다. 그러면
# 깨끗한 checkout인 CI와 같은 명령이 다른 테스트 집합을 돌고, 그 안에 tests/ 사본이 있으면 conftest 모듈 이름이
# 겹쳐 수집 오류로 멈춘다. 경로를 직접 주면(`pytest tests/test_web.py`) 이 설정과 상관없이 그 경로를 돈다.
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # 인자 기본값에 Depends()를 두는 것은 FastAPI의 의도된 사용법이다
