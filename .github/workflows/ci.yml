name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        # Only the app database exists up front, like a fresh `docker compose up -d db`,
        # so every run also exercises the test fixtures' database/extension setup.
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raguser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings reads these at import time; the tests swap in their own DB session.
      DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/ragdb
      JWT_SECRET_KEY: ci-only-secret
      TEST_DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/ragdb_test
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag (`v10` does not exist), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
