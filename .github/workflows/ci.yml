name: CI

on:
  push:
    branches: [master]
  pull_request:
  # 수동 실행(Actions 화면의 Run workflow 또는 `gh workflow run ci.yml`). 코드가 바뀌지 않았어도 새로 공개된
  # 취약점 권고를 확인하고 싶을 때 push 없이 test·audit를 다시 돌린다. 주기 실행(schedule)은 공개 저장소에
  # 정기 실행과 실패 알림을 만드는 지속 설정이라 넣지 않았다.
  workflow_dispatch:

# GITHUB_TOKEN에는 저장소 읽기 권한만 준다. 지정하지 않으면 저장소 설정의 기본 권한(설정에 따라 쓰기 포함)으로
# 돌고, 이렇게 한 범위라도 적으면 적지 않은 범위는 모두 권한 없음이 된다. 두 작업은 코드를 받아 검사만 하므로
# 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        # 처음에는 앱 DB(ragdb)만 있다. 새로 띄운 `docker compose up -d db`와 같은 상태라, 매 실행이 테스트
        # 픽스처가 ragdb_test DB와 확장(vector, pgcrypto)을 직접 만드는 경로(tests/conftest.py)도 함께 거친다.
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: ragdb
        ports:
          - 5432:5432
        # 헬스체크는 docker-compose.yml의 db와 같다. -d로 실제 DB 이름을 줘야 pg_isready가 사용자 이름과 같은
        # 없는 DB(raguser)로 접속을 시도하지 않아, 서비스 로그에 5초마다 FATAL이 남지 않는다(판정은 같음).
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 앱 설정(Settings)이 import 때 이 값들을 읽는다. 테스트는 DB 세션을 TEST_DATABASE_URL 쪽으로 바꿔
      # 끼운다(tests/conftest.py).
      DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/ragdb
      # 32바이트 이상: 더 짧으면 PyJWT가 HS256 키 길이 경고를 내고, 앱도 시작할 때 약한 키 경고를 남긴다.
      JWT_SECRET_KEY: ci-only-secret-not-used-by-any-deployment
      TEST_DATABASE_URL: postgresql+asyncpg://raguser:ragpass@localhost:5432/ragdb_test
      UV_PYTHON: "3.11"

    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정하고, 줄 끝 주석에 그 SHA가 가리키는 릴리스 태그를 적는다. 태그는
      # 옮겨질 수 있어서(actions/checkout의 v7은 새 v7.x 릴리스마다 옮겨지는 태그다) 같은 워크플로라도 다른 코드가
      # 돌 수 있기 때문이다. 갱신은 손으로 한다: `gh api repos/<owner>/<repo>/git/ref/tags/<새 태그>`의 object.sha로
      # SHA와 주석을 함께 바꾼다(object.type이 tag인 annotated 태그면 `gh api repos/<owner>/<repo>/git/tags/<그 sha>`를
      # 한 번 더 따라가 커밋 SHA를 얻는다).
      # persist-credentials: false: checkout이 받은 GITHUB_TOKEN을 git 설정에 남기지 않는다. 뒤 단계는 git으로
      # 원격에 닿지 않으므로 토큰이 필요 없고, 남겨 두면 같은 작업의 뒤 단계(의존성 설치, 테스트 코드)가 읽을 수
      # 있다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv 판은 Dockerfile의 `COPY --from=ghcr.io/astral-sh/uv:0.12.23`과 같게 고정한다. version을 주지 않으면
      # setup-uv가 실행 때의 최신 uv를 받아(2026-10-24 실행은 0.13.5) 이미지 빌드와 CI가 서로 다른 uv로 같은
      # uv.lock을 읽는다. 판을 바꿀 때는 Dockerfile, 아래 audit 작업, README의 '로컬 개발'을 함께 바꾼다.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # 의존성 취약점 검사. uv.lock에 고정된 판을 PyPI 취약점 DB(pip-audit 기본)로 확인하고, 알려진 권고가 하나라도
  # 있으면 실패한다. python-jose의 고친 판 없는 권고처럼 코드 변경 없이 새로 생긴 권고를 바로 알기 위해 둔다.
  # - uv export로 lock의 판을 requirements 형식으로 뽑아(프로젝트 자신은 빼고) --no-deps --disable-pip로 설치나
  #   의존성 해석 없이 그 판들만 조회한다.
  # - torch는 CPU 전용 색인의 '2.x.y+cpu' 판이라 PyPI에서 찾지 못해 건너뛰어진다. 같은 소스 릴리스이므로
  #   '+cpu'를 떼고 같은 판 번호로 조회한다. --strict는 건너뛴 패키지가 있어도 실패로 본다.
  # - 고친 판이 없어 받아들이기로 한 권고가 생기면 --ignore-vuln <ID>를 이유 주석과 함께 여기에 더한다(지금은
  #   없음).
  audit:
    runs-on: ubuntu-latest
    steps:
      # 액션 SHA 고정, persist-credentials, uv 판은 test 작업과 같다(이유와 갱신 방법은 그쪽 주석).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt \
            | sed 's/+cpu//' > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict \
            --progress-spinner off
