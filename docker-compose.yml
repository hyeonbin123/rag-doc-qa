services:
  db:
    # Same image as CI. The bare pg16 tag moves with every pgvector release and Debian codename.
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Override when 5432 is taken on the host: a local Postgres, or a Windows
      # Hyper-V/WSL excluded port range (see `netsh interface ipv4 show excludedportrange
      # protocol=tcp`). DATABASE_URL/TEST_DATABASE_URL on the host must use the same port.
      # 호스트의 127.0.0.1에만 연다(기본). DB 기본 비밀번호(ragpass)가 공개돼 있으므로 같은 네트워크의 다른
      # 기기가 접속하지 못하게 한다. 컨테이너끼리(api → db)는 이 게시와 상관없이 compose 네트워크로 붙는다.
      # 게시 주소는 API의 HOST_BIND_ADDRESS와 따로인 DB_BIND_ADDRESS가 정한다. 그래서 데모를 보려고 API를
      # 0.0.0.0으로 열어도 DB는 닫힌 채로 남는다(2026-10-29 전에는 HOST_BIND_ADDRESS 하나가 둘을 함께 열었다).
      # DB까지 다른 기기에서 써야 할 때만 .env에 DB_BIND_ADDRESS=0.0.0.0을 두고, 그 전에 DB 비밀번호를 바꾼다
      # (README '2. 전체 스택 실행').
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -d로 실제 DB 이름을 준다. -d가 없으면 pg_isready가 사용자 이름과 같은 DB(raguser, 없음)로 접속을
      # 시도해, 서버 로그에 5초마다 FATAL 'database "raguser" does not exist' 한 줄이 쌓였다. PostgreSQL
      # 문서대로 pg_isready는 서버가 연결을 받는지만 보므로 이름이 틀려도 healthy 판정은 같지만, 틀린 이름의
      # 접속 시도는 서버가 실패로 기록한다. 그래서 판정은 전과 같고 로그 잡음만 없어진다. DB 이름은 위
      # environment의 POSTGRES_DB와 같은 변수를 따른다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # .env targets an app run on the host; inside the container "localhost" is the container itself.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-ragdb}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # API도 기본은 호스트의 127.0.0.1:8000에만 연다. 컨테이너 안의 uvicorn은 0.0.0.0에서 듣지만(그래야
      # Docker가 포워딩할 수 있다) 바깥에 보이는 범위는 이 게시가 정한다. 같은 네트워크의 다른 기기에서 데모를
      # 보려면 .env에 HOST_BIND_ADDRESS=0.0.0.0을 두고, 그 전에 JWT_SECRET_KEY를 무작위 값으로 바꾸고
      # APP_ENV=production을 둔다(약한 비밀키면 시작하지 않고, /docs·/redoc 화면도 꺼진다). DB 포트는 이 값을
      # 따르지 않는다(위 db의 DB_BIND_ADDRESS).
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    # exec: 마이그레이션 뒤 셸을 uvicorn으로 바꿔 uvicorn이 PID 1이 되게 한다. 그래야 docker stop의 SIGTERM이
    # uvicorn에 바로 가서 정상 종료된다. exec가 없으면 sh가 신호를 넘기지 않아 10초 뒤 SIGKILL(종료 코드
    # 137)로 끝났다. Dockerfile의 CMD와 같은 명령이다.
    command: >
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # 헬스체크: 컨테이너 안에서 /health를 불러 status가 "ok"(DB의 SELECT 1까지 성공)일 때만 healthy로 본다. uvicorn은
    # 시작 훅(임베딩 모델 올리기)이 끝나야 요청을 받으므로, healthy는 '질문을 받을 준비가 됨'을 뜻한다. 그래서
    # `docker compose up --wait api`(docs/security-scan.md)가 컨테이너가 떴을 때가 아니라 이때까지 기다린다. 이미지에
    # curl이 없어 파이썬 표준 라이브러리로 부른다. /health는 DB가 안 되면 200에 status "degraded"를 돌려주므로 상태
    # 코드만 봐서는 안 된다. start_period 동안의 실패는 세지 않고(마이그레이션·모델 올리기에 걸리는 시간),
    # start_interval로 그동안 2초마다 확인해 준비되는 즉시 healthy가 된다.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4); raise SystemExit(json.load(r)['status'] != 'ok')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

volumes:
  pgdata:
