# zap/run_zap.sh가 스캔하는 대상(docs/security-scan.md). 같은 api 이미지를 쓰되 DB 사본과 생성기 대역에
# 붙여, 스캔이 ragdb에 쓰지도 않고 LLM을 돌리지도 않게 한다. createdb -T ragdb로 사본(SCAN_DB, 기본
# ragdb_scan)을 만든 뒤 아래 명령으로 띄운다.
#   docker compose -f docker-compose.yml -f zap/compose.scan.yml up -d --wait api
services:
  ollama-stub:
    image: python:3.11-slim-trixie
    command: ["python", "/stub/ollama_stub.py"]
    volumes:
      - ./zap/ollama_stub.py:/stub/ollama_stub.py:ro

  api:
    depends_on:
      ollama-stub:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${SCAN_DB:-ragdb_scan}
      GENERATION_PROVIDER: ollama
      # 스캔 대상은 생성기 대역(ollama)만 쓰므로 Claude API 키가 필요 없다. docker-compose.yml의 env_file: .env는 .env의
      # 모든 값을 컨테이너 환경에 넣어, .env에 키가 있으면 수천 건의 공격 요청을 받는 이 프로세스의 환경(docker
      # inspect, /proc/<pid>/environ)에도 그대로 보인다. 여기서 빈 값으로 덮어써 스캔 대상에는 키가 없게 한다.
      ANTHROPIC_API_KEY: ""
      OLLAMA_BASE_URL: http://ollama-stub:11434
      # 접근 토큰 하나로 스캔 전체를 버텨야 한다(기본 수명은 30분).
      ACCESS_TOKEN_EXPIRE_MINUTES: "240"
      # 관리자 적재 API를 켜 두되 ZAP은 이 값을 모르게 한다(3차부터). 그래야 스캐너가 보내는 X-Admin-Token이
      # '꺼짐(403 disabled)'에서 멈추지 않고 '틀린 토큰(403 Invalid admin token)' 비교 경로까지 간다. 값은 스캔을
      # 띄우는 쪽이 python -c "import secrets; print(secrets.token_urlsafe(32))"로 만들어 환경 변수로만 넘기고,
      # 어디에도 저장하지 않는다. 비어 있으면 compose가 시작을 거부한다.
      ADMIN_INGEST_TOKEN: ${SCAN_ADMIN_TOKEN:?set SCAN_ADMIN_TOKEN to a random value for the scan}
